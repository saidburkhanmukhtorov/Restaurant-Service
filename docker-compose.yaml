version: '3.8'

services:
  timeline-service:
    container_name: timeline
    build: ./
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      POSTGRES_HOST: "postgres_dock"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "reservation"
    networks:
      - global-network
    depends_on:
      - migrate

  postgres:
    image: postgres:14
    container_name: postgres_dock
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: reservation
    ports:
      - "5432:5432"
    networks:
      - global-network
  
  migrate:
    image: migrate/migrate
    networks:
      - global-network
    depends_on:
      - postgres
    volumes:
      - ./migrations:/migrations
    command: [ "-path", "/migrations", "-database",  
                "postgres://postgres:root@postgres_dock:5432/reservation?sslmode=disable", 
                "up" ]
networks:
  global-network:
    external: true 